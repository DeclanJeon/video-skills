[project]
name = "video-postproduction-skills"
version = "0.1.0"
description = "Consent-gated local video postproduction contracts"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.14,<3", "typer>=0.29,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../video-production-skills"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = ["native: real installed Craft integration (no installation or private media)"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
include = ["postproduction"]
extraPaths = ["../video-production-skills"]
exclude = ["**/__pycache__"]

[tool.ruff]
target-version = "py314"
line-length = 110
[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001"]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "ARG", "PLR2004"]
